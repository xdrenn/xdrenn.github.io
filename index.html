<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея Марка Ротко</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 10;
            font-size: 14px;
            letter-spacing: 0.5px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        #controls-note {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.6);
            background: rgba(0,0,0,0.4);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div id="info">🎨 Марк Ротко — Комната созерцания</div>
    <div id="controls-note">🖱️ WASD — движение | Мышь — осмотр | Подойдите к картинам</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 2, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x404050, 1);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.5);
        dirLight.position.set(2, 5, 3);
        dirLight.castShadow = true;
        dirLight.receiveShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        const d = 10;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        dirLight.shadow.camera.near = 1;
        dirLight.shadow.camera.far = 15;
        scene.add(dirLight);

        const pointLight1 = new THREE.PointLight(0x404050, 0.8, 10);
        pointLight1.position.set(-2, 3, 2);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x404050, 0.8, 10);
        pointLight2.position.set(4, 3, -2);
        scene.add(pointLight2);

        const backLight = new THREE.PointLight(0x404050, 0.5);
        backLight.position.set(0, 2, -5);
        scene.add(backLight);

        const floorGeometry = new THREE.PlaneGeometry(15, 15);
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.3, metalness: 0.1, emissive: 0x000000 });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = 0;
        floor.receiveShadow = true;
        scene.add(floor);

        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.7, emissive: 0x000000 });

        const backWallGeo = new THREE.BoxGeometry(15, 6, 0.3);
        const backWall = new THREE.Mesh(backWallGeo, wallMaterial);
        backWall.position.set(0, 3, -7.5);
        backWall.receiveShadow = true;
        backWall.castShadow = false;
        scene.add(backWall);

        const leftWallGeo = new THREE.BoxGeometry(0.3, 6, 15);
        const leftWall = new THREE.Mesh(leftWallGeo, wallMaterial);
        leftWall.position.set(-7.5, 3, 0);
        leftWall.receiveShadow = true;
        leftWall.castShadow = false;
        scene.add(leftWall);

        const rightWallGeo = new THREE.BoxGeometry(0.3, 6, 15);
        const rightWall = new THREE.Mesh(rightWallGeo, wallMaterial);
        rightWall.position.set(7.5, 3, 0);
        rightWall.receiveShadow = true;
        rightWall.castShadow = false;
        scene.add(rightWall);

        const frontWallGeo = new THREE.BoxGeometry(15, 6, 0.3);
        const frontWall = new THREE.Mesh(frontWallGeo, wallMaterial);
        frontWall.position.set(0, 3, 7.5);
        frontWall.receiveShadow = true;
        frontWall.castShadow = false;
        scene.add(frontWall);

        const ceilingGeo = new THREE.PlaneGeometry(15, 15);
        const ceilingMaterial = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.7, emissive: 0x000000, side: THREE.DoubleSide });
        const ceiling = new THREE.Mesh(ceilingGeo, ceilingMaterial);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = 6;
        ceiling.receiveShadow = false;
        scene.add(ceiling);

        function createPaintingWithLight(width, height, texturePath, x, y, z, rotationY = 0) {
            const group = new THREE.Group();

            const canvasDepth = 0.1;
            const canvasGeo = new THREE.BoxGeometry(width, height, canvasDepth);
            const textureLoader = new THREE.TextureLoader();
            const texture = textureLoader.load(texturePath);
            const canvasMat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.8 });
            const canvas = new THREE.Mesh(canvasGeo, canvasMat);
            canvas.castShadow = true;
            canvas.receiveShadow = true;
            canvas.position.z = 0;
            group.add(canvas);

            const frameThickness = 0.05;
            const frameWidth = 0.15;
            const frameGeo = new THREE.BoxGeometry(width + frameWidth, height + frameWidth, frameThickness);
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x8b7d6b, roughness: 0.4, metalness: 0.3 });
            const frame = new THREE.Mesh(frameGeo, frameMat);
            frame.castShadow = true;
            frame.receiveShadow = true;
            frame.position.z = -0.02;
            group.add(frame);

            const spotLight = new THREE.SpotLight(0xfff0d0, 1.5, 10, Math.PI / 4, 0.5, 1);
            spotLight.position.set(0, 3.5, 0.5);
            spotLight.target.position.set(0, 0, 0);
            spotLight.castShadow = true;
            spotLight.shadow.mapSize.width = 512;
            spotLight.shadow.mapSize.height = 512;
            spotLight.shadow.camera.near = 0.5;
            spotLight.shadow.camera.far = 5;
            group.add(spotLight);
            group.add(spotLight.target);

            group.position.set(x, y, z);
            group.rotation.y = rotationY;
            scene.add(group);

            return group;
        }

        createPaintingWithLight(2.8, 4.0, 'https://i.postimg.cc/zG3Q58RN/b9f9ad03_e6f5_4ebc_9be3_598cc183db09.jpg', -3.5, 2.5, -7.35);
        createPaintingWithLight(2.8, 4.0, 'https://i.postimg.cc/zX2dx622/Mark_Rothko_Den_Haag_Gemeentemuseum_Holland_Blog_Ausstellung_Grachten_und_Giebel_Tate_Modern2.jpg', 3.5, 2.5, -7.35);
        createPaintingWithLight(2.8, 4.0, 'https://i.postimg.cc/g2wgQsfb/422461_2x.webp', -7.35, 2.5, -3.0, Math.PI / 2);
        createPaintingWithLight(2.8, 4.0, 'https://i.postimg.cc/0NDc2Q52/aef3d173b0be81eec73bc4c3cde7304e.jpg', -7.35, 2.5, 3.0, Math.PI / 2);
        createPaintingWithLight(2.8, 4.0, 'https://i.postimg.cc/fRT3BWgS/Upscaled_Image.png', 7.35, 2.5, -3.0, -Math.PI / 2);
        createPaintingWithLight(2.8, 4.0, 'https://i.postimg.cc/NGDBb8qY/Upscaled_(1).png', 7.35, 2.5, 3.0, -Math.PI / 2);
        createPaintingWithLight(2.8, 4.0, 'https://i.postimg.cc/Y0Dc73Mg/Upscaled-Artwork.png', -3.5, 2.5, 7.35, Math.PI);
        createPaintingWithLight(2.8, 4.0, 'https://i.postimg.cc/jjYNfqrX/Снимок_экрана_2026_01_29_в_1_13_08_AM.png', 3.5, 2.5, 7.35, Math.PI);

        const pedestalMat = new THREE.MeshStandardMaterial({ color: 0x554433, roughness: 0.8 });
        const pedestalGeo = new THREE.BoxGeometry(0.8, 0.4, 0.8);
        const pedestal1 = new THREE.Mesh(pedestalGeo, pedestalMat);
        pedestal1.position.set(-2, 0.2, -1);
        pedestal1.castShadow = true;
        pedestal1.receiveShadow = true;
        scene.add(pedestal1);

        const pedestal2 = new THREE.Mesh(pedestalGeo, pedestalMat);
        pedestal2.position.set(3, 0.2, 2);
        pedestal2.castShadow = true;
        pedestal2.receiveShadow = true;
        scene.add(pedestal2);

        const sphereGeo = new THREE.SphereGeometry(0.4, 16, 16);
        const sphereMat = new THREE.MeshStandardMaterial({ color: 0xffeedd, emissive: 0x442211 });
        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        sphere.position.set(0, 1.2, 0);
        sphere.castShadow = true;
        sphere.receiveShadow = true;
        scene.add(sphere);

        const controls = new PointerLockControls(camera, document.body);

        renderer.domElement.addEventListener('click', () => {
            controls.lock();
        });

        const keyState = {
            w: false, a: false, s: false, d: false
        };

        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'KeyW': keyState.w = true; break;
                case 'KeyA': keyState.a = true; break;
                case 'KeyS': keyState.s = true; break;
                case 'KeyD': keyState.d = true; break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'KeyW': keyState.w = false; break;
                case 'KeyA': keyState.a = false; break;
                case 'KeyS': keyState.s = false; break;
                case 'KeyD': keyState.d = false; break;
            }
        });

        const moveSpeed = 0.1;
        const minX = -6.5, maxX = 6.5;
        const minZ = -6.5, maxZ = 6.5;

        scene.add(controls.getObject());

        function animate() {
            requestAnimationFrame(animate);

            if (controls.isLocked) {
                const direction = new THREE.Vector3();
                camera.getWorldDirection(direction);
                direction.y = 0;
                direction.normalize();

                const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), direction).negate();

                if (keyState.w) {
                    camera.position.addScaledVector(direction, moveSpeed);
                }
                if (keyState.s) {
                    camera.position.addScaledVector(direction, -moveSpeed);
                }
                if (keyState.a) {
                    camera.position.addScaledVector(right, moveSpeed);
                }
                if (keyState.d) {
                    camera.position.addScaledVector(right, -moveSpeed);
                }

                camera.position.x = Math.max(minX, Math.min(maxX, camera.position.x));
                camera.position.z = Math.max(minZ, Math.min(maxZ, camera.position.z));
                camera.position.y = 1.7;
            }

            renderer.render(scene, camera);
        }

        animate();
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
